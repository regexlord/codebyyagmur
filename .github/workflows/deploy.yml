name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Media Assets
        run: |
          mkdir -p public/assets/aistudio
          find . -maxdepth 2 -type f \( -name "*Profesyonel*" -o -name "*dogduino*" \) -not -path "*/public/*" -not -path "*/dist/*" -exec cp -v {} public/assets/aistudio/ \; || true

      - name: Build
        run: npm run build

      - name: Ensure Media in Dist
        run: |
          mkdir -p dist/assets/aistudio
          cp -rf public/assets/* dist/assets/ 2>/dev/null || true
          find . -maxdepth 2 -type f \( -name "*Profesyonel*" -o -name "*dogduino*" \) -not -path "*/dist/*" -exec cp -f {} dist/assets/aistudio/ \; 2>/dev/null || true
          find . -maxdepth 2 -type f \( -name "*Profesyonel*" -o -name "*dogduino*" \) -not -path "*/dist/*" -exec cp -f {} dist/ \; 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
